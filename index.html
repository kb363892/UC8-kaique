<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Gravador de Áudio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container-gravador">
        
        <!-- Botão que para clicar em gravar -->
        <button id="btn-gravador">
            🎤 Clique e Segure para Gravar
        </button>

 
        <!-- Elemento visual para mostrar o status -->
        <p id="status-gravacao">
            Status: Pronto para gravar
        </p>
            <!-- CARD DO ÁUDIO -->
            <div id="cardAudio" class="card-audio">

                <h3>🎵 Áudio gravado</h3>

                <audio id="audioPlayer" controls></audio>

            </div>
            
        </div>





    <script src="js/script.js"></script>

</body>
</html>
